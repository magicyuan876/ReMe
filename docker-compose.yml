# ReMe multi-tenant memory service.
#
#   cp example.env .env      # set LLM_API_KEY / LLM_BASE_URL
#   docker compose up -d --build
#
# Tenant memory persists in the ./tenant-data host directory (one subdir per
# tenant). Calls must carry an X-Reme-Tenant header:
#   curl -s localhost:2333/search -H 'Content-Type: application/json' \
#        -H 'X-Reme-Tenant: alice' -d '{"query":"...", "limit":5}'
#
# SECURITY: trusted_header trusts whoever sets X-Reme-Tenant. Keep this port on a
# private network behind your authenticated backend/gateway; do not expose it raw.
services:
  reme:
    build: .
    image: reme-multitenant:latest
    restart: unless-stopped
    ports:
      - "2333:2333"
    env_file:
      - .env
    environment:
      REME_WORKSPACES_ROOT: /data/tenants
      REME_HOST: 0.0.0.0
      REME_PORT: "2333"
      # Docker Desktop may inject a corporate HTTP(S) proxy into the container.
      # List hosts/IPs that must be reached DIRECTLY (e.g. a LAN model server) in
      # REME_NO_PROXY in .env, or the proxy will intercept those calls.
      NO_PROXY: ${REME_NO_PROXY:-localhost,127.0.0.1}
      no_proxy: ${REME_NO_PROXY:-localhost,127.0.0.1}
      # Vector search is OFF by default (BM25 + wikilink). To enable, uncomment
      # the next line and set EMBEDDING_API_KEY in .env. The embedding client is
      # shared; each tenant keeps its own vector index under its workspace.
      # REME_EMBEDDING_STORE: default
    volumes:
      - ./tenant-data:/data
