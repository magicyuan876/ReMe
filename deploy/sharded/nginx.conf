worker_processes auto;
events { worker_connections 1024; }

http {
    # Route each tenant to exactly one shard by consistent-hashing the
    # X-Reme-Tenant header. Same tenant -> same shard (so shards can safely
    # share one tenant-data volume). Requests without the header (version /
    # health_check) all hash to one shard, which is fine — they're tenant-agnostic.
    upstream reme_shards {
        hash $http_x_reme_tenant consistent;
        server reme0:2333;
        server reme1:2333;
        server reme2:2333;
        server reme3:2333;
    }

    server {
        listen 2333;
        client_max_body_size 32m;          # large auto_memory / resource payloads

        location / {
            proxy_pass http://reme_shards;
            proxy_set_header Host $host;
            proxy_set_header X-Reme-Tenant $http_x_reme_tenant;
            proxy_read_timeout 300s;        # auto_dream / LLM long tasks
            proxy_send_timeout 300s;
            add_header X-Reme-Upstream $upstream_addr always;   # which shard served it (ops/debug)
        }
    }
}
